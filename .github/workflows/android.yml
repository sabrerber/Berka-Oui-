
name: Build Berka-Oui APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          unzip Berka-oui-projet.zip
          cd Berka-oui
          echo "Project extracted"

      - name: Build APK
        run: |
          cd Berka-oui
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Berka-Oui-APK
          path: Berka-oui/app/build/outputs/apk/debug/app-debug.apk
